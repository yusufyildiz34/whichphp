name: Index

# Rebuilds the public index of PHP inside popular images. Each run checks every tag's
# digest with a HEAD request (free under Docker Hub's pull limits) and rescans only tags
# that changed, failed, are new, or haven't been scanned for 7 days.
#
# The scan job reads third-party images, so it holds no write token: it hands the new
# data to the publish job as an artifact. Only the publish job can push to the data
# branch, and it runs no scanner.
#
# Publishing is gated by the repository variable PUBLISH_INDEX. Until it is "true",
# scheduled runs are skipped and manual runs only test the pipeline: nothing is
# committed, uploaded or deployed, and the log shows counts, not verdicts. Set it only
# after the maintainers of affected images have been told (see CONTRIBUTING.md).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      max_scans:
        description: "Maximum image scans in this run (0 = no limit)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: index
  cancel-in-progress: false

env:
  SYFT_VERSION: v1.55.0
  GRYPE_VERSION: v0.121.0
  SITE_URL: https://yusufyildiz34.github.io/whichphp/

jobs:
  scan:
    name: Scan the images
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PUBLISH_INDEX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image layers need room. Remove preinstalled toolchains this job doesn't use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Release archives checked against SHA-256 hashes pinned in the script; a version
      # without pinned hashes fails here rather than quietly losing the pin.
      - name: Install Syft, Grype and whichphp
        env:
          REQUIRE_PINNED: "1"
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          bash scripts/install-tools.sh "$HOME/bin"
          go build -trimpath -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o "$HOME/bin/whichphp" ./cmd/whichphp
          "$HOME/bin/grype" db update
          "$HOME/bin/grype" db status

      # Authenticated pulls get a higher Docker Hub limit. Add DOCKERHUB_USERNAME and a
      # read-only DOCKERHUB_TOKEN as repository secrets; without them the run is anonymous.
      - name: Log in to Docker Hub
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The repository is public, so the data branch can be read without a token.
      - name: Fetch the current data
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi

      # whichphp's own digest checks read the Docker Hub credentials from env.
      - name: Update the index
        env:
          GRYPE_DB_AUTO_UPDATE: "false"
          MAX_SCANS: ${{ github.event.inputs.max_scans || '0' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$MAX_SCANS" =~ ^[0-9]+$ ]]; then
            echo "::error::max_scans must be a whole number"
            exit 1
          fi
          whichphp index --images index/images.csv --data data --max-scans "$MAX_SCANS" --site-url "$SITE_URL"

      - name: Show disk usage
        if: ${{ always() }}
        run: df -h /

      # Artifacts of a public repository can be downloaded by anyone signed in, so a
      # test run (PUBLISH_INDEX not "true") uploads nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ vars.PUBLISH_INDEX == 'true' }}
        with:
          name: index-data
          path: data/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the data
    needs: scan
    if: ${{ vars.PUBLISH_INDEX == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the data branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index-data
          path: ${{ runner.temp }}/index-data

      # The artifact comes from the job that parsed untrusted images, so take only the
      # expected files, and only if they are well-formed and of a sane size.
      - name: Check the scan's output
        env:
          NEW_DATA: ${{ runner.temp }}/index-data
          CHECKED: ${{ runner.temp }}/checked
        run: |
          set -euo pipefail
          mkdir -p "$CHECKED/badges"
          limit() {
            if [ ! -f "$1" ] || [ -L "$1" ] || [ "$(stat -c %s "$1")" -gt "$2" ]; then
              echo "::error::$(basename "$1") is missing, not a regular file, or larger than $2 bytes"
              exit 1
            fi
          }
          limit "$NEW_DATA/index.json" 20000000
          jq -e '.schema == 1 and (.entries | type == "array")' "$NEW_DATA/index.json" > /dev/null
          cp "$NEW_DATA/index.json" "$CHECKED/"
          if [ -e "$NEW_DATA/history.jsonl" ]; then
            limit "$NEW_DATA/history.jsonl" 50000000
            jq -c . "$NEW_DATA/history.jsonl" > /dev/null
            cp "$NEW_DATA/history.jsonl" "$CHECKED/"
          fi
          for f in "$NEW_DATA"/badges/*.json; do
            name="$(basename "$f")"
            if [[ ! "$name" =~ ^[a-z-]+\.json$ ]]; then
              echo "::error::unexpected badge file $name"
              exit 1
            fi
            limit "$f" 4096
            jq -e '.schemaVersion == 1' "$f" > /dev/null
            cp "$f" "$CHECKED/badges/"
          done
          # Feeds are served from the site, so they must be plain Atom: only Atom
          # elements, text content, links to the site, no DTDs or entities. Anything
          # else could run script in a browser that opens the file.
          mkdir -p "$CHECKED/feeds"
          if [ -d "$NEW_DATA/feeds" ]; then
            python3 - "$NEW_DATA/feeds" "$CHECKED/feeds" "$SITE_URL" <<'PY'
          import os, re, shutil, sys
          import xml.etree.ElementTree as ET
          src, dst, site = sys.argv[1:4]
          atom = "{http://www.w3.org/2005/Atom}"
          header = b'<?xml version="1.0" encoding="UTF-8"?>\n'
          allowed = {"feed", "title", "subtitle", "id", "updated", "link", "author", "name", "uri", "generator", "entry", "content"}
          names = sorted(os.listdir(src))
          if len(names) > 2000:
              sys.exit(f"::error::{len(names)} feed files")
          for name in names:
              path = os.path.join(src, name)
              if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,99}\.xml", name) or os.path.islink(path) or not os.path.isfile(path):
                  sys.exit(f"::error::unexpected feed file {name!r}")
              if os.path.getsize(path) > 1_000_000:
                  sys.exit(f"::error::feed {name} is too large")
              data = open(path, "rb").read()
              # UTF-8 with Go's exact header, so these byte checks see all markup: no other
              # processing instruction (xml-stylesheet runs XSLT), DTD, comment or CDATA.
              body = data[len(header):]
              if not data.startswith(header) or b"<?" in body or b"<!" in body or b"\0" in data:
                  sys.exit(f"::error::feed {name} has a DTD, processing instruction or unexpected encoding")
              body.decode("utf-8")
              root = ET.fromstring(data)
              if root.tag != atom + "feed":
                  sys.exit(f"::error::feed {name} isn't an Atom feed")
              for el in root.iter():
                  if not el.tag.startswith(atom) or el.tag[len(atom):] not in allowed:
                      sys.exit(f"::error::feed {name} has an unexpected element {el.tag}")
                  for attr, value in el.attrib.items():
                      if attr not in ("rel", "type", "href") or (attr != "type" and el.tag != atom + "link"):
                          sys.exit(f"::error::feed {name} has attribute {attr}")
                      if attr == "href" and not value.startswith(site):
                          sys.exit(f"::error::feed {name} links outside the site")
                  if el.tag == atom + "content" and el.get("type") != "text":
                      sys.exit(f"::error::feed {name} has non-text content")
                  if el.get("type") is not None and el.tag not in (atom + "link", atom + "content"):
                      sys.exit(f"::error::feed {name} has a typed {el.tag}")
              shutil.copyfile(path, os.path.join(dst, name))
          print(f"{len(names)} feeds checked")
          PY
          fi

      - name: Commit the data
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_DATA: ${{ runner.temp }}/checked
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add data-branch FETCH_HEAD
            git -C data-branch checkout -B data
          else
            git worktree add --orphan -b data data-branch
          fi
          # The feeds are regenerated each run; drop any that are no longer produced.
          rm -rf data-branch/feeds
          cp -R "$NEW_DATA/." data-branch/
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Index update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q "$remote" data
          fi

      - name: Prepare the site
        env:
          NEW_DATA: ${{ runner.temp }}/checked
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp "$NEW_DATA/index.json" _site/index.json
          cp -R "$NEW_DATA/badges" _site/badges
          cp -R "$NEW_DATA/feeds" _site/feeds

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Publishes the site only when the repository is public and PUBLISH_INDEX is "true".
  deploy:
    name: Deploy the site
    needs: publish
    if: ${{ !github.event.repository.private && vars.PUBLISH_INDEX == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
