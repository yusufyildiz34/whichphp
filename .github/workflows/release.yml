name: Release

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds whichphp for
# Linux, macOS and Windows on amd64 and arm64 and publishes a GitHub release with the
# archives, SHA256 checksums and signed build provenance. Verify a download with:
#   gh attestation verify whichphp_0.1.0_linux_amd64.tar.gz --repo yusufyildiz34/whichphp
#
# The build job only reads the repository; the publish job, which can write, runs no
# repository code. A tag with a suffix (v0.2.0-rc.1) becomes a pre-release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/build-release.sh "$TAG" dist
          tar -xzf "dist/whichphp_${TAG#v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/whichphp_${TAG#v}_linux_amd64/whichphp" version | grep -Fx "whichphp $TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Fails if the release already exists: published assets are never replaced.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --title "whichphp $TAG" "${prerelease[@]}"
