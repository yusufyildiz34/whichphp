name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go that go.mod allows, and the newest, which builds the releases.
        go: [oldest, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'oldest' && 'go.mod' || '' }}
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o whichphp ./cmd/whichphp && ./whichphp version

  release-build:
    name: Release build (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Build every release archive
        run: |
          bash scripts/build-release.sh v0.0.0-ci dist
          (cd dist && sha256sum -c SHA256SUMS)
          tar -xzf dist/whichphp_0.0.0-ci_linux_amd64.tar.gz -C dist
          dist/whichphp_0.0.0-ci_linux_amd64/whichphp version | grep -Fx "whichphp v0.0.0-ci"
