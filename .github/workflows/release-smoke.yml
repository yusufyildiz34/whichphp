name: Release smoke test

# Runs the published whichphp Action the way a security-conscious user does: pinned to
# the commit SHA of the latest release, with a read-only token. The action should find
# the release tag for that commit, download the release archive, and check its checksum
# and its signed build provenance (built by release.yml from exactly that commit)
# before it scans anything. A source build would also pass the scans, so the comparison
# step checks that the binary that ran is the release build, and the last step checks the
# release's Sigstore bundle on its own, with no token. Dependabot moves the pin at its
# first weekly run after a release, and its pull request runs this test against the new
# release before the pin changes on main.
on:
  push:
    branches: [main]
    paths: [".github/workflows/release-smoke.yml"]
  pull_request:
    paths: [".github/workflows/release-smoke.yml"]
  schedule:
    - cron: "37 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Released action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Pre-fix image
        id: before
        uses: yusufyildiz34/whichphp@efbbf97cc91509ac4eed3072d49ad5d4ba3c3a55 # v0.2.0
        with:
          image: php:8.4.26-apache
          platform: linux/amd64
          fail-on: never
          sarif-file: before.sarif

      - name: Fixed image
        id: after
        uses: yusufyildiz34/whichphp@efbbf97cc91509ac4eed3072d49ad5d4ba3c3a55 # v0.2.0
        with:
          image: php:8.4.27-apache
          platform: linux/amd64
          sarif-file: after.sarif

      - name: Compare with the expected results
        env:
          BEFORE: ${{ steps.before.outputs.action }}
          BEFORE_JSON: ${{ steps.before.outputs.json-file }}
          AFTER: ${{ steps.after.outputs.action }}
          INSTALL: ${{ steps.before.outputs.install }}
        run: |
          set -euo pipefail
          echo "pre-fix: $BEFORE; fixed: $AFTER"
          test "$BEFORE" = ACTION_NEEDED
          test "$AFTER" = OK
          # A release build reports its tag; a source build of a SHA pin reports the SHA.
          version="$(jq -r .version "$BEFORE_JSON")"
          echo "whichphp version: $version"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The action built whichphp from source instead of using the release."
            exit 1
          fi
          # Releases after v0.1.0 say how they were installed; anything but a release
          # whose provenance was checked is a failure.
          echo "install: ${INSTALL:-(not reported by this release)}"
          if { [ "$version" != v0.1.0 ] || [ -n "$INSTALL" ]; } && [ "$INSTALL" != release-verified ]; then
            echo "::error::The release was installed as ${INSTALL:-(nothing reported)}, not release-verified."
            exit 1
          fi

      # The action falls back to GitHub's attestation API when the bundle check fails,
      # which would hide a broken bundle on github.com. Check the bundle on its own, with
      # no token, the way a GitHub Enterprise runner would.
      - name: Verify the release's Sigstore bundle without a token
        env:
          BEFORE_JSON: ${{ steps.before.outputs.json-file }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          version="$(jq -r .version "$BEFORE_JSON")"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base="https://github.com/yusufyildiz34/whichphp/releases/download/$version"
          dir="$(mktemp -d)"
          curl -sSfL --retry 3 -o "$dir/archive.tar.gz" "$base/whichphp_${version#v}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$dir/bundle.json" "$base/whichphp_${version#v}.sigstore.json"
          gh attestation verify "$dir/archive.tar.gz" --bundle "$dir/bundle.json" --hostname github.com \
            --repo yusufyildiz34/whichphp --signer-workflow yusufyildiz34/whichphp/.github/workflows/release.yml \
            --source-ref "refs/tags/$version"
