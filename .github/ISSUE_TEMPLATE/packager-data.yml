name: Packager fixed-build data
description: Add or correct which builds from a packager include the PHP2Shell fixes.
title: "Fixed builds: <packager>"
labels: ["data"]
body:
  - type: input
    id: packager
    attributes:
      label: Packager or repository
      placeholder: "Sury, Remi, GetPageSpeed, TuxCare, Freexian, CloudLinux, cPanel, ..."
    validations:
      required: true
  - type: textarea
    id: builds
    attributes:
      label: Fixed builds
      description: Package names and the first release that includes the fix, per PHP branch and OS release, with the epoch where the package has one, as `dpkg-query -W` or `rpm -q --qf '%{EPOCH}:%{VERSION}-%{RELEASE}'` shows it (leave out the epoch where rpm prints `(none)`).
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Link to the packager's own advisory, changelog, tracker or repository for each entry, showing the version and the CVE IDs. Blog and forum posts can't be the only source.
    validations:
      required: true
